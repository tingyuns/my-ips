name: Auto Update Cloudflare IPs

on:
  # 1. 定时触发：每小时的第 0 分钟排队运行
  schedule:
    - cron: '*/1 * * * *'
  # 2. 手动触发：允许你在面板上点击运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. 运行 Python 脚本生成 ip.txt
    - name: Run update script
      run: python update_ips.py

    # 4. 将生成的 ip.txt 推送回仓库
    - name: Commit and Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add ip.txt
        # 检查文件是否有变动，有变动才提交，无变动直接跳过防止报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPs" && git push)
